<!doctype html>
<html lang="en" data-theme="umber">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1c1917" />

  <script>
    (function (html) {
      html.classList.add('js');
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        html.classList.add('motion-reduced');
      }
      var theme = 'umber';
      try {
        var stored = localStorage.getItem('theme');
        if (stored === 'dark' || stored === 'umber' || stored === 'light') {
          theme = stored;
          html.setAttribute('data-theme', theme);
        }
      } catch (e) {}
      var themeColors = { light: '#f7f4ec', dark: '#0f172b', umber: '#1c1917' };
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', themeColors[theme]);
      try {
        if (sessionStorage.getItem('splashSeen') === '1') {
          html.classList.add('splash-seen');
        }
      } catch (e) {}
    })(document.documentElement);
  </script>

  <title>Page not found | Farhan Segujja</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preload" href="/fonts/nunito.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/revalia.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/sour-gummy.woff2" as="font" type="font/woff2" crossorigin />

  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div class="page-transition" aria-hidden="true"></div>
  <div class="cursor-dot" aria-hidden="true"></div>

  <div class="splash-screen" data-splash aria-hidden="true">
    <div class="splash-particles" data-splash-particles></div>
    <img src="/favicon.svg" alt="" width="96" height="96" class="splash-logo" data-splash-logo />
  </div>

  <a href="#main" class="skip-link">Skip to content</a>

  <header class="site-header">
    <div class="container-page flex flex-wrap items-center justify-between gap-4 py-4">
      <a href="/" class="inline-flex items-center" aria-label="Farhan Segujja">
        <img src="/favicon.svg" alt="" width="40" height="40" class="h-10 w-10" />
      </a>
      <nav aria-label="Primary" class="hidden lg:block">
        <ul class="flex flex-wrap gap-x-5 gap-y-1 text-sm text-ink-muted">
          <li><a href="/work/" class="hover:text-ink">Work</a></li>
          <li><a href="/#experience" class="hover:text-ink">Experience</a></li>
          <li><a href="/#about" class="hover:text-ink">About</a></li>
          <li><a href="/#contact" class="hover:text-ink">Contact</a></li>
        </ul>
      </nav>
      <div class="flex items-center gap-2">
        <button type="button" data-theme-toggle class="theme-toggle" aria-label="Change color theme">
          <svg data-theme-icon="light" class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
          <svg data-theme-icon="dark" class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg data-theme-icon="umber" class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 2c4 5 7 9.5 7 13a7 7 0 0 1-14 0c0-3.5 3-8 7-13z"></path>
          </svg>
          <span data-theme-toggle-label></span>
        </button>
        <details class="nav-mobile">
          <summary class="nav-toggle" aria-label="Open menu">
            <span class="nav-toggle-bar"></span>
            <span class="nav-toggle-bar"></span>
            <span class="nav-toggle-bar"></span>
          </summary>
          <nav aria-label="Primary (mobile)" class="nav-drawer">
            <ul class="flex flex-col gap-1">
              <li><a href="/work/" class="nav-drawer-link">Work</a></li>
              <li><a href="/#experience" class="nav-drawer-link">Experience</a></li>
              <li><a href="/#about" class="nav-drawer-link">About</a></li>
              <li><a href="/#contact" class="nav-drawer-link">Contact</a></li>
            </ul>
          </nav>
        </details>
      </div>
    </div>
    <div class="scroll-progress" aria-hidden="true"></div>
  </header>

  <main id="main" class="container-page py-20 lg:py-28" data-reveal>
    <p class="kicker mb-2">404</p>
    <h1 class="h-section mb-4">Page not found</h1>
    <p class="measure mb-6 text-ink-muted">
      That page doesn't exist. It may have moved, or the link may be out of date.
    </p>
    <a href="/" class="btn">Back to homepage</a>
  </main>

  <footer class="rule-top">
    <div class="container-page flex flex-wrap items-center justify-between gap-4 py-8 text-sm text-ink-muted">
      <p>© 2026 Farhan Segujja</p>
      <p class="font-mono text-xs">farhansegujja.com</p>
    </div>
  </footer>

  <script type="module" src="/src/motion.js"></script>
</body>
</html>
